name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: ruff + syntax + README + notebook structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint (ruff)
        uses: astral-sh/ruff-action@v1

      - name: Notebook syntax + structure checks
        run: python3 scripts/check_notebook.py

      - name: README / link validation
        run: python3 scripts/check_readme.py

      - name: Summary
        run: |
          echo "GPU inference is validated manually on Kaggle; CI validates the non-GPU project components."